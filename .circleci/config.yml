# https://circleci.com/docs/2.0/workflows/#using-workspaces-to-share-data-among-jobs
defaults: &defaults
  working_directory: ~/drush
  environment:
    TZ: "/usr/share/zoneinfo/America/Los_Angeles"
    TERM: dumb
    PHPUNIT_ARGS: ""

version: 2.1

executors:
  linux83:
    docker:
      - image: wodby/php:8.3
        environment:
          - MYSQL_HOST=127.0.0.1
          - UNISH_DB_URL=mysql://root:@127.0.0.1
      - image: cimg/mysql:8.0
  linux83-mariadb:
    docker:
      - image: wodby/php:8.3
        environment:
          - MYSQL_HOST=127.0.0.1
          - UNISH_DB_URL=mysql://root:@127.0.0.1
      - image: cimg/mariadb:11.4

commands:
  prepare_php:
    description: Installs the extensions we need and configures PHP to run Drush tests
    steps:
      - run: cp .docker/zz-php.ini /usr/local/etc/php/conf.d/
      - run: php --version

jobs:
  lint:
    <<: *defaults
    docker:
      - image:  wodby/php:8.4
    steps:
      - checkout
      - run: composer install --prefer-dist --no-interaction
      - run: composer lint

  test:
    parameters:
      os:
        type: executor
      drupal:
        type: string
    executor: << parameters.os >>
    environment:
      UNISH_NO_TIMEOUTS: y
      UNISH_DRUPAL_VERSION: << parameters.drupal >>
    steps:
      - checkout
      - prepare_php
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpunit --testsuite all

workflows:
  build_test:
    jobs:
      - lint
      - test:
          name: test-drupal-7-php-8.3
          drupal: "7"
          os: linux83
      - test:
          name: test-drupal-7-php-8.3-mariadb
          drupal: "7"
          os: linux83-mariadb
