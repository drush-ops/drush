name: Build docs site

on:
  push:
    # 0.x is used to build and preview docs site changes.
    branches: [ 11.x, 12.x, 13.x, 14.x, 15.x, 0.x ]
    tags: ["11.*", "12.*", "13.*", "14.*", "15.*"]

jobs:
  build:
    permissions:
      contents: write # for git push
    name: Build docs and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Drush Documentation Bot"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Zensical has no versioning of its own yet. Its maintainers keep a fork of mike that
          # builds with Zensical. https://zensical.org/docs/compatibility/mkdocs/mike/
          pip install zensical git+https://github.com/squidfunk/mike.git
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, gd, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: |
          composer -n config platform.php --unset
          composer -n install --prefer-dist
      - name: Install Drupal
        run: composer sut:si
      - name: Drupal status
        run: vendor/bin/dr system:status
      - name: Drush mk:docs
        run: composer mk:docs
      - name: Mike alias
        run: mike alias 13.x latest --update-aliases
      - name: Mike set-default
        run: mike set-default latest
      # See https://github.com/jimporter/mike?tab=readme-ov-file#building-your-docs
      - name: Mike deploy
        run: mike deploy --push ${GITHUB_REF_NAME}
      # Build Doctum to gh-pages/api in the gh-pages branch.
      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
      - name: Git pull
        run: cd gh-pages && git pull
      - name: Install Doctum
        run: composer doctum-install
      - name: Doctum build
        run: |
          rm -rf gh-pages/latest/api
          composer api -- --only-version=${GITHUB_REF_NAME}
      # GitHub Pages serves only the root 404.html, for a missing URL at any depth. Copy this
      # version's 404 page there. Its absolute links point at /latest, which holds only redirect
      # pages and no assets, so point them at this version's directory instead. The base needs a
      # trailing slash or the search index resolves to /search/ instead of /<version>/search/.
      - name: Root 404 page
        if: github.ref_name == '15.x'
        run: |
          sed -E \
            -e "s#\"base\": ?\"/latest\"#\"base\":\"/${GITHUB_REF_NAME}/\"#" \
            -e "s#\"/latest([/\"])#\"/${GITHUB_REF_NAME}\\1#g" \
            gh-pages/${GITHUB_REF_NAME}/404.html > gh-pages/404.html
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[CI] Add Doctum build and root 404 page"
          repository: gh-pages
          commit_user_name: "Drush Documentation Bot"
          commit_user_email: "actions@github.com"
