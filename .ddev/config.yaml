type: php
docroot: sut
php_version: "8.5"
router_http_port: "87"
router_https_port: "444"
disable_settings_management: true
# https://ddev.readthedocs.io/en/latest/users/extend/database-types/
# When switching DBs, use ddev delete --omit-snapshot
#database:
#  type: postgres
#  version: 14
web_environment:
  - UNISH_DB_URL=mysql://root:root@db/unish_dev?module=mysql
#  - "UNISH_DB_URL=sqlite://:memory:?module=sqlite"
#  - UNISH_DB_URL=pgsql://db:db@db:5432?module=pgsql
  - EDITOR=nano
  # For `dr`. `composer sut:si` installs the site into DRUPAL_DEV_SITE_PATH,
  # and sut/sites/sites.php serves it at the DDEV URL.
  - DRUPAL_URI=$DDEV_PRIMARY_URL
  - DRUPAL_DEV_SITE_PATH=sites/dev
